<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Iconografía propia del catálogo. Trazo de 1.6 px sobre retícula de 24,
    extremos redondeados y geometría sobria: la misma familia visual para los
    controles de interfaz y para las familias de maquinaria, de modo que el
    conjunto se lea como un sistema y no como iconos sueltos de una librería.
    Sin dependencias externas: un único archivo referenciado con <use>.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      symbol .solid { fill: currentColor; stroke: none; }
    </style>
  </defs>

  <!-- ============ Interfaz ============ -->

  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
  </symbol>

  <symbol id="icon-close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>

  <symbol id="icon-menu" viewBox="0 0 24 24">
    <path d="M4 7h16M4 12h16M4 17h10"/>
  </symbol>

  <symbol id="icon-heart" viewBox="0 0 24 24">
    <path d="M12 20s-7.5-4.6-7.5-9.6A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/>
  </symbol>

  <symbol id="icon-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
  </symbol>

  <symbol id="icon-moon" viewBox="0 0 24 24">
    <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/>
  </symbol>

  <symbol id="icon-grid" viewBox="0 0 24 24">
    <rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/>
    <rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>
  </symbol>

  <symbol id="icon-list" viewBox="0 0 24 24">
    <rect x="4" y="5" width="16" height="5" rx="1"/><rect x="4" y="14" width="16" height="5" rx="1"/>
  </symbol>

  <symbol id="icon-chevron-down" viewBox="0 0 24 24">
    <path d="M6 9.5l6 6 6-6"/>
  </symbol>

  <symbol id="icon-arrow-right" viewBox="0 0 24 24">
    <path d="M4.5 12h15M14 6.5l5.5 5.5L14 17.5"/>
  </symbol>

  <symbol id="icon-arrow-left" viewBox="0 0 24 24">
    <path d="M19.5 12h-15M10 6.5L4.5 12 10 17.5"/>
  </symbol>

  <symbol id="icon-download" viewBox="0 0 24 24">
    <path d="M12 3.5v11M7.5 10.5L12 15l4.5-4.5M4.5 19.5h15"/>
  </symbol>

  <symbol id="icon-zoom-in" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M11 8.5v5M8.5 11h5"/>
  </symbol>

  <symbol id="icon-zoom-out" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5"/>
  </symbol>

  <symbol id="icon-alert" viewBox="0 0 24 24">
    <path d="M12 4.5l8.5 15h-17z"/><path d="M12 10v4"/><circle cx="12" cy="16.6" r=".9" class="solid"/>
  </symbol>

  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  </symbol>

  <symbol id="icon-tag" viewBox="0 0 24 24">
    <path d="M4.5 11.2V5a.5.5 0 0 1 .5-.5h6.2a1 1 0 0 1 .7.3l7.3 7.3a1 1 0 0 1 0 1.4l-6.2 6.2a1 1 0 0 1-1.4 0L4.8 12.4a1 1 0 0 1-.3-.7z"/>
    <circle cx="8.6" cy="8.6" r="1.2"/>
  </symbol>

  <symbol id="icon-refresh" viewBox="0 0 24 24">
    <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5V9H15"/>
  </symbol>

  <symbol id="icon-whatsapp" viewBox="0 0 24 24">
    <path d="M4.5 19.5l1.1-3.7A7.5 7.5 0 1 1 8.4 18.5z"/>
    <path d="M9.2 9.4c.3 2.4 2.9 5 5.3 5.3l1.1-1.4 1.7.9-.4 1.6c-2.9.8-7.6-3.6-7.6-6.5l1.6-.5.9 1.7z" class="solid"/>
  </symbol>

  <symbol id="icon-phone" viewBox="0 0 24 24">
    <path d="M6.2 4.5h3l1.4 3.5-2 1.6a11 11 0 0 0 5.8 5.8l1.6-2 3.5 1.4v3a1.5 1.5 0 0 1-1.6 1.5C11.4 18.7 5.3 12.6 4.7 6.1A1.5 1.5 0 0 1 6.2 4.5z"/>
  </symbol>

  <symbol id="icon-mail" viewBox="0 0 24 24">
    <rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M4 7l8 5.5L20 7"/>
  </symbol>

  <!-- ============ Familias de maquinaria ============ -->

  <!-- Bombas y motobombas: caracol con boca de succión y descarga -->
  <symbol id="icon-pump" viewBox="0 0 24 24">
    <circle cx="10.5" cy="13" r="5.5"/><circle cx="10.5" cy="13" r="1.6"/>
    <path d="M10.5 7.5V4h4M16 13h4.5M16.5 9.5l3-1.5"/>
  </symbol>

  <!-- Fumigación: lanza pulverizadora con abanico -->
  <symbol id="icon-spray" viewBox="0 0 24 24">
    <path d="M4.5 15.5h6.5V19a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1z"/>
    <path d="M6 15.5V9.5h4V15.5M8 9.5V6h4"/>
    <path d="M15.5 5.5l2.5-1M15.5 8l3 .5M15.5 10.5l2.5 2"/>
  </symbol>

  <!-- Manguera: tramo enrollado con racor -->
  <symbol id="icon-hose" viewBox="0 0 24 24">
    <path d="M4.5 18c0-6 4-9 7.5-9s6 2 6 4.5-2 4-4 4-3-1.2-3-2.5"/>
    <path d="M4.5 15.5v5M2.5 18h4"/>
  </symbol>

  <!-- Desbrozadora: eje, manillar y disco de corte -->
  <symbol id="icon-trimmer" viewBox="0 0 24 24">
    <path d="M18.5 4.5L8 15"/><path d="M15.5 5.5l3.5-1-1 3.5"/>
    <path d="M13.5 9.5l2.5 2.5"/>
    <circle cx="6.5" cy="16.5" r="3.5"/><path d="M4 14l5 5M9 14l-5 5"/>
  </symbol>

  <!-- Motosierra: cuerpo y espada dentada -->
  <symbol id="icon-chainsaw" viewBox="0 0 24 24">
    <path d="M3.5 12.5h5.5v4H5a1.5 1.5 0 0 1-1.5-1.5z"/>
    <path d="M5 12.5V9.5h4.5v3"/>
    <path d="M9 10.5h9a1.5 1.5 0 0 1 1.5 1.5v1.5H9z"/>
    <path d="M11 13.5v1.5M14 13.5v1.5M17 13.5v1.5"/>
  </symbol>

  <!-- Ahoyadora: broca helicoidal -->
  <symbol id="icon-auger" viewBox="0 0 24 24">
    <path d="M12 3.5v17"/><path d="M12 20.5l-2-2.5M12 20.5l2-2.5"/>
    <path d="M8 6.5h8M8.5 10h7M9 13.5h6"/>
  </symbol>

  <!-- Sopladora: turbina y flujo de aire -->
  <symbol id="icon-blower" viewBox="0 0 24 24">
    <circle cx="8" cy="12" r="4.5"/><circle cx="8" cy="12" r="1.3"/>
    <path d="M12.5 10.5h7M12.5 13.5h5M14 16.5h4"/>
  </symbol>

  <!-- Motoazada: rotor de cuchillas sobre eje -->
  <symbol id="icon-tiller" viewBox="0 0 24 24">
    <circle cx="12" cy="14" r="3"/>
    <path d="M12 11V8M12 17v3M9 14H6M15 14h3M9.8 11.8L7.7 9.7M14.2 16.2l2.1 2.1M14.2 11.8l2.1-2.1M9.8 16.2l-2.1 2.1"/>
  </symbol>

  <!-- Motor 4T: bloque con cilindro y polea -->
  <symbol id="icon-engine" viewBox="0 0 24 24">
    <rect x="4.5" y="10" width="11" height="8" rx="1"/>
    <path d="M7.5 10V6.5h5V10"/>
    <circle cx="18.5" cy="14" r="2.2"/><path d="M15.5 14h.8"/>
    <path d="M6.5 18v2M13.5 18v2"/>
  </symbol>

  <!-- Hidrolavadora: pistola de alta presión -->
  <symbol id="icon-pressure" viewBox="0 0 24 24">
    <path d="M4.5 13.5h7v3H6a1.5 1.5 0 0 1-1.5-1.5z"/>
    <path d="M7 13.5v-3h4.5v3"/><path d="M11.5 12h6l2.5-2v5l-2.5-2h-6"/>
    <path d="M8 16.5v3.5"/>
  </symbol>

  <!-- Genérico -->
  <symbol id="icon-gear" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6"/>
  </symbol>
</svg>
